# sjb-complexify: saved symjit applications with their MIR complexified by symjit itself
# (Application::complexify), for PacRunner's kernel_c. Built by PacRunner.install_complexify().
[package]
name = "sjb-complexify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
# Application::complexify for every complex application (siravan/symjit PR #32, 2.28.x): a
# commit until the fix is released
symjit = { git = "https://github.com/siravan/symjit", rev = "d68abeb", default-features = false }

[workspace]

[profile.release]
opt-level = 2
